name: Deploy

# Builds the Vite bundle and publishes it to GitHub Pages. This does nothing
# until Pages is enabled: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  # Allows a deploy by hand, e.g. to roll forward after a fix.
  workflow_dispatch:

# Read the repo, write a Pages deployment, and mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A deploy must not outrun the checks. The browser suite runs in ci.yml,
      # which gates the pull request that lands here.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite.config.js sets base: "./", so the bundle works from a project
      # sub-path (user.github.io/Image-Processor/) as well as a domain root.
      - name: Build
        run: npm run build

      # Publishing needs a Pages site to exist, which is a repository setting
      # (Settings -> Pages -> Source: GitHub Actions) and cannot be created by
      # the default GITHUB_TOKEN. Rather than failing every push until someone
      # flips it, the job checks first and reports what to do.
      - name: Check whether Pages is configured
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "Pages is configured; continuing with the deploy."
              ;;
            404)
              # The documented "no Pages site yet" answer, and the same signal
              # actions/configure-pages turns into a hard failure.
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Pages not enabled::Deploy skipped. Turn it on at Settings -> Pages -> Source: GitHub Actions, then re-run this workflow. Everything else already passed."
              ;;
            *)
              # 401/403/5xx mean the check itself is broken. Skipping quietly
              # here would hide a real deploy failure forever, so fail loudly.
              echo "::error title=Pages check failed::Unexpected HTTP $status from the Pages API. Not safe to assume Pages is unconfigured."
              exit 1
              ;;
          esac

      - name: Configure Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      # Only dist/ is published: the service worker, manifest and hashed assets
      # as Vite emitted them, and nothing else from the repository.
      - name: Upload artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
