name: Deploy

# Builds the Vite bundle and publishes it to GitHub Pages. This does nothing
# until Pages is enabled: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  # Allows a deploy by hand, e.g. to roll forward after a fix.
  workflow_dispatch:

# Read the repo, write a Pages deployment, and mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A deploy must not outrun the checks. The browser suite runs in ci.yml,
      # which gates the pull request that lands here.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite.config.js sets base: "./", so the bundle works from a project
      # sub-path (user.github.io/Image-Processor/) as well as a domain root.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Only dist/ is published: the service worker, manifest and hashed assets
      # as Vite emitted them, and nothing else from the repository.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
